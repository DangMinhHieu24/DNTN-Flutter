name: app_hoctap
description: "AI Learning Coach - Mindful Curator Package Module"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Kết nối các Module nội bộ
  core:
    path: packages/core
  features:
    path: packages/features

  # Các thư viện chính để dùng ở main.dart (nếu cần)
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

